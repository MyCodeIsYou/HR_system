# https://supabase.com/docs/guides/local-development/cli/config
project_id = "hr-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "https://mycodeisyou.github.io/HR_system"
additional_redirect_urls = ["https://mycodeisyou.github.io/HR_system", "https://mycodeisyou.github.io/HR_system/**", "http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[functions.invite-member]
verify_jwt = false
